name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org com.monstrvip --platforms=android --project-name baby_puzzle_world .

      - name: Generate offline sound effects
        run: python3 tool/generate_audio.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking diagnostics)
        continue-on-error: true
        run: flutter analyze

      - name: Verify generated sound assets
        run: test -s assets/audio/tap.wav && test -s assets/audio/correct.wav && test -s assets/audio/win.wav

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BabyPuzzleWorld-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
